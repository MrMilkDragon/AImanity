[package]
name = "aimanity-device-io"
version = "0.0.6"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ai-phone-api = { path = "../api" }
ai-phone-adb = { path = "../adb-client" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.29", default-features = false }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
