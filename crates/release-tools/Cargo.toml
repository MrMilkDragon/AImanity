[package]
name = "ai-phone-release-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "release-tools"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["runtime_detection", "zlib-rs"] }
fs2 = "=0.4.3"
md-5 = "=0.10.6"
pem-rfc7468 = { version = "=0.7.0", features = ["std"] }
regex = "1"
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "=0.4.46", default-features = false }
tempfile = "3"
xz2 = { version = "=0.1.7", features = ["static"] }

[target.'cfg(unix)'.dependencies]
ai-phone-api = { path = "../api" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
prost = "=0.14.4"
reqwest = { version = "=0.12.28", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process"] }
tokio = { version = "1", features = ["process", "time", "macros", "rt", "net", "io-util", "io-std"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
