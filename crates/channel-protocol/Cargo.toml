[package]
name = "aimanity-channels"
version = "0.0.6"
edition = "2024"
publish = false
license-file = "../../LICENSE"
repository = "https://github.com/MrMilkDragon/AImanity"

[dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
prost = "0.14"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
redb = "=5.0.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart","socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["tokio-native"] }
