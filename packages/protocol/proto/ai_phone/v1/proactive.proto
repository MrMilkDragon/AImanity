syntax = "proto3";
package ai_phone.v1;
message ProactiveRequest {}
message TodoItem {
  string id = 1;
  string title = 2;
  string source = 3;
  string status = 4;
  string device = 5;
}
message TodoList { repeated TodoItem items = 1; }
message TodoMove {
  string id = 1;
  string before_id = 2;
}
message ProactiveState {
  uint64 revision = 1;
  bool exploring = 2;
  bool notifications_enabled = 3;
  bool forward_notifications = 4;
  bool autonomous_reply = 5;
  bool autonomous_install = 6;
  uint32 interval_seconds = 7;
  uint64 next_wake_at_ms = 8;
  string active_run_id = 9;
  string status = 10;
  string last_error = 11;
  bool listener_connected = 12;
  uint32 pending_notifications = 13;
  string latest_summary = 14;
  string delivery_status = 15;
  bool wechat_watch = 16;
  bool attention_connected = 17;
  string goal = 18;
  bool goal_active = 19;
  string goal_status = 20;
  string goal_device_id = 21;
}
message ProactiveUpdateRequest {
  uint64 expected_revision = 1;
  bool exploring = 2;
  bool notifications_enabled = 3;
  bool forward_notifications = 4;
  bool autonomous_reply = 5;
  bool autonomous_install = 6;
  uint32 interval_seconds = 7;
  optional bool wechat_watch = 8;
}
message GoalUpdateRequest {
  uint64 expected_revision = 1;
  string goal = 2;
  string device_id = 3;
}
message Plan {
  string id = 1;
  string task = 2;
  string trigger = 3;
  string time = 4;
  repeated uint32 weekdays = 5;
  string app = 6;
  string contains = 7;
  string date = 8;
}
message PlanList { repeated Plan items = 1; }
message PlanPrompt { string text = 1; }
message PlanRemove { string id = 1; }
