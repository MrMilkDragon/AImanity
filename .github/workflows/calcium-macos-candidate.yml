name: Calcium macOS signed candidate
on:
  push:
    branches: [codex/calcium-carrier]
    paths: [.github/workflows/calcium-macos-candidate.yml, scripts/calcium-macos-package.ts]
permissions:
  contents: read
env:
  CALCIUM_SOURCE: f7f4b57cc425a36956475ebca238ee6ff0b506b6
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  macos-dmg:
    runs-on: macos-26
    timeout-minutes: 100
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ env.CALCIUM_SOURCE }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: carrier
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare the disposable Apple Silicon compiler
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$CALCIUM_SOURCE"
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 aarch64-unknown-linux-musl
          ./scripts/bootstrap.sh
          ./scripts/bun scripts/source.ts check --repository --manifest
          if ! command -v tesseract >/dev/null; then brew install tesseract; fi
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          ./scripts/bun scripts/prepare-ocr-models.ts --destination "$RUNNER_TEMP/aimanity-ocr"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aimanity-ocr" >> "$GITHUB_ENV"
      - name: Build the exact Web runtime and signed DMG
        run: |
          set -euo pipefail
          donor="$RUNNER_TEMP/AImanity-0.0.2-macos-arm64.dmg"
          curl -fsSL --retry 3 -o "$donor" https://github.com/MrMilkDragon/AImanity/releases/download/v0.0.2/AImanity-0.0.2-macos-arm64.dmg
          ./scripts/bun run build
          ./scripts/bun "$GITHUB_WORKSPACE/carrier/scripts/calcium-macos-package.ts" "$PWD" "$donor" "$RUNNER_TEMP/calcium-macos"
          test -s dist/AImanity-0.0.3-macos-arm64.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: calcium-macos-signed-dmg
          path: |
            source/dist/AImanity-0.0.3-macos-arm64.dmg
            source/dist/AImanity-0.0.3-macos-arm64.dmg.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
