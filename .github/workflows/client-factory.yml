name: Desktop installer factory
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Complete offline installer
        type: choice
        options: [macos, windows]
        required: true
      android_draft_id:
        description: Draft release ID in this private factory repository
        type: string
        required: true
      android_payload_sha256:
        description: SHA-256 of android-macos-arm64.payload or android-windows-x64.payload in the draft
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  AIMANITY_ANDROID_DRAFT_ID: ${{ inputs.android_draft_id }}
  AIMANITY_ANDROID_PAYLOAD_SHA256: ${{ inputs.android_payload_sha256 }}
concurrency:
  group: installer-${{ inputs.platform }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a private build repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != true ]; then
            echo "::error::Run the installer factory in a private repository."
            exit 1
          fi

  windows-qemu:
    if: inputs.platform == 'windows'
    needs: admit
    uses: ./.github/workflows/windows-qemu.yml

  windows-guest:
    if: inputs.platform == 'windows'
    needs: [admit, windows-qemu]
    uses: ./.github/workflows/windows-guest.yml
    with:
      baseline_artifact: ${{ needs.windows-qemu.outputs.baseline }}

  windows-exe:
    needs: [windows-qemu, windows-guest]
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_HTTP_MULTIPLEXING: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Locked build tools
        shell: bash
        run: |
          cmake --version
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Prepare Authenticode tools
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --needed --noconfirm mingw-w64-ucrt-x86_64-osslsigncode'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\ucrt64\bin' >> $env:GITHUB_PATH
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.windows-qemu.outputs.artifact }}
          path: dist/windows-qemu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.windows-guest.outputs.artifact }}
          path: dist/windows-guest
      - name: Fetch the sealed offline Android component
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --quiet --locked -p ai-phone-release-tools -- factory-android
      - name: Assemble and inspect the offline Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
          QEMU_SHA256: ${{ needs.windows-qemu.outputs.identity }}
          GUEST_SHA256: ${{ needs.windows-guest.outputs.identity }}
        run: |
          cargo run --locked -p ai-phone-release-tools -- windows-factory build dist/windows-qemu $env:QEMU_SHA256 dist/windows-guest/windows-guest.payload $env:GUEST_SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-windows-installer
          path: |
            dist/AImanity-*-windows-x64-setup.exe
            dist/AImanity-*-windows-x64-setup.exe.manifest.json
            dist/windows-full-factory-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  native-arm-rootfs:
    if: inputs.platform == 'macos'
    needs: admit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.retain.outputs.artifact-id }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated ARM64 builder
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y debootstrap zstd musl-tools
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-unknown-linux-musl
      - name: Build shared Linux runtime and ARM64 guest helper
        run: |
          cargo build --locked -p ai-phone-release-tools
          target/debug/release-tools source check --repository --manifest
          cargo build --release --locked -p ai-phone-guest-runtime --target aarch64-unknown-linux-musl --bin desktop-bridge
          mkdir "$RUNNER_TEMP/mac-linux"
          install -m 0755 target/aarch64-unknown-linux-musl/release/desktop-bridge "$RUNNER_TEMP/mac-linux/desktop-bridge"
          keyring=$(scripts/stage-debian-keyring.sh "$RUNNER_TEMP/trixie-keyring")
          sudo env AI_PHONE_DEBIAN_KEYRING="$keyring" target/debug/release-tools factory-images rootfs arm64 "$RUNNER_TEMP/mac-linux/linux-rootfs.tar.zst"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/mac-linux/linux-rootfs.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: retain
        with:
          name: macos-linux-runtime
          path: ${{ runner.temp }}/mac-linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  full-macos-arm64:
    if: inputs.platform == 'macos'
    needs: native-arm-rootfs
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable Mac factory toolchain
        run: |
          set -euo pipefail
          cmake --version
          # This hosted job builds only macOS/ARM Linux, so no Android NDK is
          # consumed. Reclaim only this disposable runner's unused compiler SDKs.
          rm -rf "$ANDROID_HOME/ndk"
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add --toolchain 1.96.0 aarch64-linux-android x86_64-linux-android
          brew update
          brew install --force-bottle tesseract
          cargo run --quiet --locked -p ai-phone-release-tools -- prepare-ocr-models --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          df -h .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native-arm-rootfs.outputs.artifact }}
          path: ${{ runner.temp }}/mac-linux
      - name: Fetch the sealed offline Android component
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --quiet --locked -p ai-phone-release-tools -- factory-android
      - name: Build the complete Mac client
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PHONE_RELEASE_DESKTOP_BRIDGE: ${{ runner.temp }}/mac-linux/desktop-bridge
        run: cargo run --quiet --locked -p ai-phone-release-tools -- macos-factory --compiler-sdk "$ANDROID_HOME" --linux-rootfs "$RUNNER_TEMP/mac-linux/linux-rootfs.tar.zst"
      - name: Retain text qualification receipts
        if: always() && hashFiles('dist/macos-full-factory-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-macos-build-receipt
          path: |
            dist/macos-full-factory-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the complete installer for maintainer delivery
        if: always() && hashFiles('dist/AImanity-*-macos-arm64.dmg.manifest.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: complete-macos-installer
          path: |
            dist/AImanity-*-macos-arm64.dmg
            dist/AImanity-*-macos-arm64.dmg.manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
