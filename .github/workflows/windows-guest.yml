name: Windows Linux guest
on:
  workflow_call:
    inputs:
      baseline_artifact:
        description: Verified Calcium backing disk and kernel artifact
        required: true
        type: string
    outputs:
      artifact:
        description: Private Windows Linux guest artifact ID
        value: ${{ jobs.linux.outputs.artifact }}
      identity:
        description: SHA-256 of windows-guest.payload
        value: ${{ jobs.linux.outputs.identity }}
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      identity: ${{ steps.disk.outputs.sha256 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
    steps:
      - name: Require a private build repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::Run the Windows guest factory in a private repository."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up the disposable Linux x64 builder
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = x86_64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME/ndk"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cpio \
            ca-certificates unzip e2fsprogs qemu-utils \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.baseline_artifact }}
          path: ${{ runner.temp }}/windows-calcium-baseline
      - name: Start the disposable Docker image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: ai-phone-windows-guest
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Build the Linux release components
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PHONE_DISPOSABLE_QUALIFICATION: '1'
        run: |
          cargo build --release --locked -p ai-phone-guest-runtime --bin desktop-bridge
          AI_PHONE_RELEASE_DESKTOP_BRIDGE="$PWD/target/release/desktop-bridge" \
            ./scripts/bun scripts/wsl-backend.ts --release-layer "$RUNNER_TEMP/windows-release-context"
      - name: Assemble the offline layer on the immutable Calcium guest disk
        id: disk
        run: |
          guest=dist/windows-guest/windows-guest.payload
          cargo run --locked --quiet -p ai-phone-release-tools -- \
            windows-release "$RUNNER_TEMP/windows-calcium-baseline" "$RUNNER_TEMP/windows-release-context" "$guest"
          guest_hash=$(sha256sum "$guest")
          printf 'sha256=%s\n' "${guest_hash%% *}" >> "$GITHUB_OUTPUT"
      - name: Transfer the sealed guest to the Windows builder
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-guest
          path: dist/windows-guest/windows-guest.payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
