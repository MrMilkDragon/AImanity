name: Windows Linux guest
on:
  workflow_call:
    inputs:
      kernel_artifact:
        description: Pinned guest kernel and its license
        required: true
        type: string
    outputs:
      artifact:
        description: Private Windows Linux guest artifact ID
        value: ${{ jobs.linux.outputs.artifact }}
      identity:
        description: SHA-256 of windows-guest.payload
        value: ${{ jobs.linux.outputs.identity }}
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      identity: ${{ steps.disk.outputs.sha256 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
    steps:
      - name: Require a private build repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::Run the Windows guest factory in a private repository."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up the disposable Linux x64 builder
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = x86_64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME/ndk"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cpio busybox-static \
            ca-certificates unzip e2fsprogs qemu-utils debootstrap zstd \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.kernel_artifact }}
          path: ${{ runner.temp }}/windows-guest-kernel
      - name: Build the amd64 filesystem and native offline assets
        run: |
          cargo build --quiet --locked -p ai-phone-release-tools --bin release-tools
          keyring=$(scripts/stage-debian-keyring.sh "$RUNNER_TEMP/trixie-keyring")
          sudo env AI_PHONE_DEBIAN_KEYRING="$keyring" \
            "$PWD/target/debug/release-tools" factory-images rootfs amd64 "$RUNNER_TEMP/linux-rootfs.tar.zst"
          sudo env AI_PHONE_DEBIAN_KEYRING="$keyring" \
            "$PWD/target/debug/release-tools" windows-guest-assets "$RUNNER_TEMP/windows-guest-assets"
      - name: Build the Linux release components
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PHONE_DISPOSABLE_QUALIFICATION: '1'
        run: |
          CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$HOME=/build-user" \
          CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_STRIP=debuginfo \
            cargo build --release --locked -p ai-phone-guest-runtime --bin desktop-bridge
          AI_PHONE_RELEASE_DESKTOP_BRIDGE="$PWD/target/release/desktop-bridge" \
            target/debug/release-tools windows-release-context "$RUNNER_TEMP/windows-release-context" \
              --linux-rootfs "$RUNNER_TEMP/linux-rootfs.tar.zst" --guest-assets "$RUNNER_TEMP/windows-guest-assets"
      - name: Assemble the new Debian guest and offline device tools
        id: disk
        run: |
          guest=dist/windows-guest/windows-guest.payload
          target/debug/release-tools windows-release \
            "$RUNNER_TEMP/windows-guest-kernel" "$RUNNER_TEMP/windows-release-context" "$guest"
          guest_hash=$(sha256sum "$guest")
          printf 'sha256=%s\n' "${guest_hash%% *}" >> "$GITHUB_OUTPUT"
      - name: Transfer the sealed guest to the Windows builder
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-guest
          path: dist/windows-guest/windows-guest.payload
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
