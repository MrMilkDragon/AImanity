name: Dysprosium Windows Android selector diagnosis
on:
  push:
    branches: [codex/dysprosium-windows-secure-replay]
    paths:
      - .github/workflows/dysprosium-windows-secure-replay.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: dysprosium-windows-secure-replay
  cancel-in-progress: false
env:
  PRODUCT_SOURCE: d6ce29502bb650a07ede40fa044c1261030f4078
  CALCIUM_ANDROID_SHA: 23a97514fdbdbcfaa511549b6e016923023de28ce2de0ad71a2815192b9568ce
jobs:
  selector-transaction:
    runs-on: windows-2025
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_SOURCE }}
          path: exact
          persist-credentials: false
      - name: Select the isolated Android-only profile
        shell: pwsh
        run: |
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Root -match '^[A-Z]:\\$' } | Sort-Object Free -Descending | Select-Object -First 1
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $drive.Free -lt 40GB) { throw 'Expected a disposable Windows test host.' }
          $root = Join-Path $drive.Root "Dysprosium-QA-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $root | Out-Null
          "AIMANITY_QA_ROOT=$root" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 44007412821
          github-token: ${{ github.token }}
          name: isolated-input-apk
          path: ${{ env.AIMANITY_QA_ROOT }}/inputs
      - name: Measure selector binding after Android reports the installed accessibility service
        working-directory: exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          ./scripts/bootstrap.sh
          ./scripts/bun scripts/source.ts check --repository --manifest
          ./scripts/bun ../qa/windows-native-dev/prepare-android-replay.ts
          cp ../qa/windows-native-dev/android-secure-replay.ts scripts/android-secure-replay.ts
          ./scripts/bun scripts/android-secure-replay.ts "$AIMANITY_QA_ROOT/portable/host/android.payload" "$AIMANITY_QA_ROOT/android-only"
