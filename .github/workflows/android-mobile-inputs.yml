name: Android mobile ARM64 offline inputs
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [build/android-mobile-inputs]
permissions:
  contents: read
  actions: read
jobs:
  phone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Extract the published ARM64 guest partitions and speech model
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/Europium.dmg"
          mount="$RUNNER_TEMP/published"
          out="$RUNNER_TEMP/mobile-inputs"
          mkdir -p "$mount" "$out/android" "$out/speech"
          curl -fLsS --retry 3 'https://github.com/MrMilkDragon/AImanity/releases/download/v0.0.5/AImanity-0.0.5-macos-arm64.dmg' -o "$image"
          echo "c33cf818b29ccfb4198e97052e0820c68d528e634003c35f249eb5e7618c434f  $image" | shasum -a 256 -c -
          hdiutil attach -mountpoint "$mount" -readonly -nobrowse "$image"
          trap 'hdiutil detach "$mount"' EXIT
          resource="$mount/AImanity.app/Contents/Resources/host"
          tar -tf "$resource/android.payload" > "$RUNNER_TEMP/android-members"
          awk '/^sdk\/avo\/images\// {print}' "$RUNNER_TEMP/android-members" > "$RUNNER_TEMP/selected"
          test -s "$RUNNER_TEMP/selected"
          tar --strip-components 3 -xf "$resource/android.payload" -C "$out/android" -T "$RUNNER_TEMP/selected"
          for f in boot.img init_boot.img vendor_boot.img; do test -s "$out/android/$f"; done
          cp "$resource/speech/ggml-tiny-q5_1.bin" "$out/speech/"
          du -h "$out/android/"* | sort -h
          # Keep the sparse Android partitions compressed for transfer between runners.
          tar -cJf "$RUNNER_TEMP/android-arm64-inputs.tar.xz" -C "$out" android speech
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: europium-mobile-android-arm64-inputs
          path: ${{ runner.temp }}/android-arm64-inputs.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
