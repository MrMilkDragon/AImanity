name: Linux signed installer checks
on:
  workflow_dispatch:
    inputs:
      signed_run:
        description: Run containing fluorine-signed-linux
        required: true
        type: string
      exercise_guests:
        type: boolean
        default: false
  workflow_call:
    inputs:
      signed_run:
        required: true
        type: string
      exercise_guests:
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            package: deb
          - distro: fedora:43
            package: rpm
    name: Install ${{ matrix.package }} on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      DISTRO: ${{ matrix.distro }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Make room on the disposable runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$ANDROID_HOME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fluorine-signed-linux
          run-id: ${{ inputs.signed_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-package-key
          run-id: ${{ inputs.signed_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package-key
      - name: Install the signed package on a clean distribution
        run: |
          set -euo pipefail
          mapfile -t installer < <(find "$RUNNER_TEMP/signed" -type f -name "*.$PACKAGE")
          test "${#installer[@]}" -eq 1
          rustc --edition 2024 -C target-feature=+crt-static -O scripts/mobile-button-row.rs -o "$RUNNER_TEMP/action-row"
          devices=()
          if [[ "$PACKAGE" == deb && "${{ inputs.exercise_guests }}" == true ]]; then devices+=(--device=/dev/kvm); fi
          docker run --detach --name distro "${devices[@]}" \
            -v "${installer[0]}:/candidate.$PACKAGE:ro" \
            -v "$RUNNER_TEMP/package-key/AImanity-Fluorine.asc:/package-key.asc:ro" \
            -v "$RUNNER_TEMP/action-row:/action-row:ro" \
            -v "$PWD/scripts/check-linux-guests.sh:/check-linux-guests.sh:ro" "$DISTRO" sleep infinity
          if [[ "$PACKAGE" == deb ]]; then
            gpg --batch --dearmor -o "$RUNNER_TEMP/package-key.gpg" "$RUNNER_TEMP/package-key/AImanity-Fluorine.asc"
            ar p "${installer[0]}" _gpgorigin > "$RUNNER_TEMP/deb-origin.sig"
            ar p "${installer[0]}" debian-binary control.tar.zst data.tar.zst |
              gpgv --keyring "$RUNNER_TEMP/package-key.gpg" "$RUNNER_TEMP/deb-origin.sig" -
            docker exec -e DEBIAN_FRONTEND=noninteractive distro bash -euc '
              apt-get update -qq
              apt-get install -y task-gnome-desktop
              apt-get install -y --no-install-recommends xvfb xauth openbox wmctrl xdotool x11-utils imagemagick tesseract-ocr-eng tesseract-ocr mesa-vulkan-drivers libgl1-mesa-dri procps
              useradd -m tester
              if [ -e /dev/kvm ]; then
                gid=$(stat -c %g /dev/kvm)
                group=$(getent group "$gid" | cut -d: -f1)
                if [ -z "$group" ]; then group=runner-kvm; groupadd -g "$gid" "$group"; fi
                usermod -aG "$group" tester
              fi
            '
          else
            docker exec distro bash -euc '
              rpm --import /package-key.asc
              dnf install -y @workstation-product-environment
              dnf install -y xorg-x11-server-Xvfb openbox wmctrl xdotool xwininfo ImageMagick tesseract tesseract-langpack-eng mesa-vulkan-drivers mesa-dri-drivers procps-ng
              useradd -m tester
            '
          fi
          docker network disconnect bridge distro
          if [[ "$PACKAGE" == deb ]]; then
            docker exec -e DEBIAN_FRONTEND=noninteractive distro bash -euc 'apt-get --no-download install -y /candidate.deb && dpkg-query -W aimanity-workspace'
          else
            docker exec distro bash -euc 'dnf --disablerepo="*" --setopt=localpkg_gpgcheck=1 install -y /candidate.rpm && rpm -V aimanity-workspace'
          fi
          docker exec distro aimanity-workspace --verify-bundled-host /usr/lib/aimanity-workspace/host
          docker exec distro aimanity-workspace --android-session-contract
          docker exec distro bash -euc 'tools=/usr/lib/aimanity-workspace/host/tools; LD_LIBRARY_PATH="$tools/lib" "$tools/bin/espeak-ng" --path="$tools/share" -v cmn -w /tmp/voice.wav "你好"; test "$(stat -c %s /tmp/voice.wav)" -gt 1000; fc-scan --format "%{family}\n" /usr/share/fonts/opentype/aimanity/NotoSansCJK-Regular.ttc | grep -F "Noto Sans CJK SC"'
          docker exec -u tester -e HOME=/home/tester -e DISPLAY=:99 distro bash -euc '
            Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp > "$HOME/xvfb.log" 2>&1 &
            for i in {1..50}; do xwininfo -root >/dev/null 2>&1 && break; sleep 0.1; done
            bash /check-linux-guests.sh workbench
          '
          echo "- $DISTRO: installed the signed $PACKAGE offline, opened an empty workspace, closed it, then reopened the same database." >> "$GITHUB_STEP_SUMMARY"
      - name: Check on-demand guests with KVM
        if: inputs.exercise_guests && matrix.package == 'deb'
        run: |
          docker exec -u tester -e HOME=/home/tester -e DISPLAY=:99 distro bash /check-linux-guests.sh guests
      - name: Collect workbench screens and lifecycle log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/linux-evidence"
          for file in client.log reopen-ms.txt language.png current.png first-workbench.png reopened-workbench.png; do
            docker cp "distro:/home/tester/cold-install/$file" "$RUNNER_TEMP/linux-evidence/" 2>/dev/null || continue
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: offline-${{ matrix.package }}-evidence
          path: ${{ runner.temp }}/linux-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the disposable installation
        if: always()
        run: if docker inspect distro >/dev/null 2>&1; then docker rm -f distro; fi
