name: Windows installer acceptance
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed source commit for this native candidate
        type: string
        required: true
      candidate_run:
        description: Windows factory workflow run ID
        type: string
        required: true
      candidate_artifact:
        description: ID of the signed complete Windows candidate artifact
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  exact-exe:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Prepare acceptance tools
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Choose a fresh installation volume
        shell: pwsh
        run: |
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Root -match '^[A-Z]:\\$' } | Sort-Object Free -Descending
          $drives | ForEach-Object { 'Free on {0}: {1:N1} GiB' -f $_.Root, ($_.Free / 1GB) }
          $os = Get-CimInstance Win32_OperatingSystem
          '{0} build {1}, RAM {2:N1} GiB' -f $os.Caption, $os.BuildNumber, ($os.TotalVisibleMemorySize / 1MB)
          $root = Join-Path $drives[0].Root "AImanity-QA-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path (Join-Path $root 'profile') | Out-Null
          "AIMANITY_QA_ROOT=$root" >> $env:GITHUB_ENV
      - name: Get the signed native Windows candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ inputs.candidate_run }}
          artifact-ids: ${{ inputs.candidate_artifact }}
          github-token: ${{ github.token }}
          path: ${{ env.AIMANITY_QA_ROOT }}/candidate
      - name: Restrict installer and installed client to offline operation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:AIMANITY_QA_ROOT/candidate/*.exe" -File).FullName
          $client = Join-Path $env:AIMANITY_QA_ROOT 'installed/ai-phone-client.exe'
          foreach ($program in @($setup, $client)) {
            New-NetFirewallRule -DisplayName "AImanity offline QA $program" -Program $program -Direction Outbound -Action Block -RemoteAddress Internet | Out-Null
          }
      - name: Install the exact signed EXE
        env:
          AIMANITY_QA_SOURCE: ${{ inputs.source_sha }}
        shell: pwsh
        run: cargo run --locked -p ai-phone-host-runtime --bin qualify-windows-installer
      - name: Locate native controls on the Windows desktop
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "AIMANITY_QA_OCR=$env:ProgramFiles\Tesseract-OCR\tesseract.exe" >> $env:GITHUB_ENV
      - name: Exercise the empty workbench, on-demand guests and cold reopen
        run: cargo test --locked --manifest-path apps/native/Cargo.toml --bin aimanity-native windows_installed_guests -- --ignored --nocapture
      - name: Retain isolated workbench evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-windows-workbench
          path: |
            ${{ env.AIMANITY_QA_ROOT }}/*.png
            ${{ env.AIMANITY_QA_ROOT }}/*.log
          if-no-files-found: ignore
          retention-days: 7
