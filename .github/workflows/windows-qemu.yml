name: Windows QEMU component
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
    outputs:
      artifact:
        description: Windows QEMU artifact ID
        value: ${{ jobs.windows.outputs.artifact }}
      kernel:
        description: Pinned kernel and license artifact ID
        value: ${{ jobs.windows.outputs.kernel }}
      identity:
        description: SHA-256 of the QEMU factory manifest
        value: ${{ jobs.windows.outputs.identity }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      identity: ${{ steps.build.outputs.sha256 }}
      kernel: ${{ steps.kernel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Prepare the qualified Windows x64 QEMU component
        id: build
        shell: pwsh
        run: |
          cargo +1.96.0 run --locked -p ai-phone-release-tools -- windows-factory qemu . dist/windows-qemu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = (Get-FileHash dist/windows-qemu/windows-qemu.json -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii dist/windows-qemu/identity.txt $identity
          "sha256=$identity" >> $env:GITHUB_OUTPUT
      - name: Transfer the runtime and source receipt
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-qemu
          path: |
            dist/windows-qemu/runtime/
            dist/windows-qemu/licenses/
            dist/windows-qemu/windows-qemu.json
            dist/windows-qemu/identity.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Transfer the pinned kernel and its license
        id: kernel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-guest-kernel
          path: dist/windows-qemu/kernel/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
