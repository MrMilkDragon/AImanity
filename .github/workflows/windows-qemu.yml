name: Windows QEMU component
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Private Windows QEMU artifact ID
        value: ${{ jobs.windows.outputs.artifact }}
      baseline:
        description: Exact Calcium backing disk and kernel artifact ID
        value: ${{ jobs.windows.outputs.baseline }}
      identity:
        description: SHA-256 of the QEMU factory manifest
        value: ${{ jobs.windows.outputs.identity }}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.handoff.outputs.artifact-id }}
      identity: ${{ steps.build.outputs.sha256 }}
      baseline: ${{ steps.baseline.outputs.artifact-id }}
    steps:
      - name: Require a private build repository
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPOSITORY_PRIVATE -ne 'true') {
            throw 'Run the Windows QEMU factory in a private repository.'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fixed Bun tooling
        shell: bash
        run: ./scripts/bootstrap.sh
      - name: Prepare the qualified Windows x64 QEMU component
        id: build
        shell: pwsh
        run: |
          ./.tools/bin/bun.exe scripts/windows-qemu.ts dist/windows-qemu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = (Get-FileHash dist/windows-qemu/windows-qemu.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$identity" >> $env:GITHUB_OUTPUT
      - name: Transfer the runtime and source receipt
        id: handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-qemu
          path: |
            dist/windows-qemu/runtime/
            dist/windows-qemu/licenses/
            dist/windows-qemu/windows-qemu.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Transfer the unchanged Calcium backing disk and kernel
        id: baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-calcium-baseline
          path: dist/windows-qemu/baseline/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
