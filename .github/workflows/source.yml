name: Source checks
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pinned Rust with formatting
        run: |
          cmake --version
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Source privacy and licence metadata
        run: |
          cargo run --quiet --locked -p ai-phone-release-tools -- source check --repository --manifest
      - name: Protobuf schema
        run: |
          buf="$RUNNER_TEMP/buf"
          curl -fsSL https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64 -o "$buf"
          printf '%s  %s\n' fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b "$buf" | sha256sum -c -
          chmod +x "$buf"
          "$buf" lint
          "$buf" build
      - name: Build native test fixtures
        run: |
          cargo build -p ai-phone-host-runtime --bin host-resources --locked
      - name: Native interaction tools
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's@https\?://azure\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y curl xvfb xauth xterm x11-utils x11-xserver-utils xdotool xclip ffmpeg postgresql bubblewrap slirp4netns zstd debootstrap redis-server openjdk-21-jre-headless
          sudo sh infra/desktop/install-openbox.sh
      - name: Rust tests
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Native workspace lifecycle
        run: |
          cargo build --locked -p ai-phone-guest-runtime --bin desktop-bridge
          sudo unshare --mount --propagation private scripts/check-native-workspace.sh "$RUNNER_TEMP" "$PWD/target/debug/desktop-bridge"
      - name: Prebuilt native services and OCR
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          echo "AI_PHONE_TEST_TESSERACT=/usr/bin/tesseract" >> "$GITHUB_ENV"
          AI_PHONE_TEST_TESSERACT=/usr/bin/tesseract cargo run --quiet --locked -p ai-phone-release-tools -- native-services build
      - name: Packaged services, database roles and worker recovery
        run: |
          cargo run --quiet --locked -p ai-phone-release-tools -- client-payload --with-service-runtime
          ./scripts/check-source-services.sh --with-event-brokers
