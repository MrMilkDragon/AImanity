name: Prepare Android host Linux ARM64 guest
on:
  push:
    branches: [build/android-linux-avf]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phone-apps:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Extract the Europium guest applications from the published ARM64 DMG
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/europium.dmg"
          mount="$RUNNER_TEMP/europium"
          output="$RUNNER_TEMP/extracted"
          mkdir -p "$mount" "$output"
          curl --fail --location --retry 3 'https://github.com/MrMilkDragon/AImanity/releases/download/v0.0.5/AImanity-0.0.5-macos-arm64.dmg' --output "$dmg"
          echo "c33cf818b29ccfb4198e97052e0820c68d528e634003c35f249eb5e7618c434f  $dmg" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          source="$mount/AImanity.app/Contents/Resources/host/source.payload"
          tar -tf "$source" > "$RUNNER_TEMP/source-members"
          awk '/^runtime\/phone-apps\// {print}' "$RUNNER_TEMP/source-members" > "$RUNNER_TEMP/mobile-members"
          test -s "$RUNNER_TEMP/mobile-members"
          tar -xf "$source" -C "$output" -T "$RUNNER_TEMP/mobile-members"
          for asset in manifest.json input.apk home.apk; do test -s "$output/runtime/phone-apps/$asset"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: europium-avf-guest-phone-apps
          path: ${{ runner.temp }}/extracted/runtime/phone-apps/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  linux:
    needs: phone-apps
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
      AI_PHONE_DISPOSABLE_QUALIFICATION: '1'
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: europium-avf-guest-phone-apps
          path: ${{ runner.temp }}/mobile-phone-apps
      - name: Prepare the disposable ARM64 runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = aarch64
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap e2fsprogs cpio \
            kmod file zstd lz4 xz-utils ca-certificates pkg-config libssl-dev \
            libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-unknown-linux-musl
      - name: Fetch the pinned Europium ARM64 workspace disk and bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14718706944/zip" > runtime.zip
          echo '6157c59a251a845f24cebe4e3e0be33ffeeb37a7e849e51335daed951b992b9a  runtime.zip' | sha256sum -c -
          unzip -q runtime.zip -d published
          rm runtime.zip
          readelf -h published/desktop-bridge | grep -E "Machine:[[:space:]]+AArch64"
          zstd -t published/linux-rootfs.tar.zst
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            target/release
          key: linux-avf-arm64-rust196-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: linux-avf-arm64-rust196-${{ hashFiles('Cargo.lock') }}-
      - name: Compile the guest bootstrap and seal its offline bundle
        id: compile
        env:
          GH_TOKEN: ${{ github.token }}
          AI_PHONE_RELEASE_DESKTOP_BRIDGE: ${{ runner.temp }}/published/desktop-bridge
          AI_PHONE_RELEASE_PHONE_APPS: ${{ runner.temp }}/mobile-phone-apps
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          set -euo pipefail
          cargo build --quiet --locked --release --target aarch64-unknown-linux-musl \
            --manifest-path apps/android-host/Cargo.toml --bin aimanity-avf-guest-relay
          cargo run --quiet --locked -p ai-phone-release-tools -- \
            android-linux-context "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/published/linux-rootfs.tar.zst"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            target/release
          key: linux-avf-arm64-rust196-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Install Debian trixie, prepare the kernel and make the writable disk seed
        run: |
          set -euo pipefail
          keyring=$(scripts/stage-debian-keyring.sh "$RUNNER_TEMP/trixie-keyring")
          sudo unshare --mount --propagation private bash scripts/mobile-linux-avf.sh \
            "$RUNNER_TEMP/compiled" "$RUNNER_TEMP/linux-avf" "$RUNNER_TEMP/avf-assets" "$keyring" \
            "$PWD/apps/android-host/target/aarch64-unknown-linux-musl/release/aimanity-avf-guest-relay"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/avf-assets"
          cd "$RUNNER_TEMP/avf-assets"
          sha256sum linux/* > "$RUNNER_TEMP/linux-prepared.sha256"
          sha256sum -c "$RUNNER_TEMP/linux-prepared.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: europium-mobile-linux-avf-assets
          path: ${{ runner.temp }}/avf-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-guest-preparation-receipt
          path: ${{ runner.temp }}/linux-prepared.sha256
          if-no-files-found: error
          retention-days: 30
