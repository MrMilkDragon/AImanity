name: Publish Fluorine Linux installers
on:
  workflow_call:
    inputs:
      build_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Linux desktop packages run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sign:
    uses: ./.github/workflows/linux-sign.yml
    with:
      build_run: ${{ inputs.build_run }}
  install:
    needs: sign
    uses: ./.github/workflows/linux-install-check.yml
    with:
      signed_run: ${{ format('{0}', github.run_id) }}
  publish:
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fluorine-signed-linux
          path: dist
      - name: Add the Debian and RPM installers to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.0.6
          base="repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          for file in dist/AImanity-0.0.6-linux-amd64.deb dist/AImanity-0.0.6-linux-x86_64.rpm; do
            wanted="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual=$(gh api "$base" --jq ".assets[]|select(.name==\"$(basename "$file")\")|.digest")
            if [[ -z "$actual" ]]; then
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
              actual=$(gh api "$base" --jq ".assets[]|select(.name==\"$(basename "$file")\")|.digest")
            fi
            test "$actual" = "$wanted"
          done
