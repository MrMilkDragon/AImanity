name: Native client checks
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [macos, windows]
        required: true
      factory_run:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  install-over-original:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-26' || 'windows-2022' }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Download the unchanged original 0.0.6 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/overlay-profile"
          if [[ $PLATFORM == macos ]]; then
            file=AImanity-0.0.6-macos-arm64.dmg
            digest=f7d2ff21425555374aeb72042436cc8e5d986856688f4e8d30e3422a763cbc74
          else
            file=AImanity-0.0.6-windows-x64-setup.exe
            digest=6a167304ff149a88ecd41dd20f9d8b014344421cb8353f8d05d421847a91289b
          fi
          gh release download v0.0.6 --pattern "$file" --dir "$RUNNER_TEMP/original"
          cd "$RUNNER_TEMP/original"
          if [[ $PLATFORM == macos ]]; then actual=$(shasum -a 256 "$file"); else actual=$(sha256sum "$file"); fi
          [[ ${actual%% *} == "$digest" ]]
          printf 'AIMANITY_QA_ROOT=%s\n' "$RUNNER_TEMP/overlay-profile" >> "$GITHUB_ENV"
      - name: Install original DMG
        if: runner.os == 'macOS'
        run: bash scripts/overlay-install-mac.sh "$RUNNER_TEMP/original/"*.dmg
      - name: Install original EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe=(Get-ChildItem "$env:RUNNER_TEMP/original/*.exe").FullName
          ./scripts/overlay-install-win.ps1 $exe
      - name: Open original client, create and read its workspace
        shell: bash
        env:
          AIMANITY_QA_PHASE: baseline
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 test --locked --manifest-path apps/native/Cargo.toml --bin aimanity-native fluorine_overlay -- --ignored --nocapture
          rm -f "$RUNNER_TEMP/original/"AImanity-0.0.6-*
      - name: Fetch this hotfix's signed installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY: ${{ inputs.factory_run }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [[ $FACTORY =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FACTORY" |
            jq -e '.path == ".github/workflows/client-factory.yml" and .head_sha=="54be836db330b23b655b8b60b73ead02ca46dc8e" and .conclusion=="success"' >/dev/null
          gh run download "$FACTORY" --name "complete-$PLATFORM-installer" --dir "$RUNNER_TEMP/hotfix"
      - name: Replace installed Mac app at its original location
        if: runner.os == 'macOS'
        run: bash scripts/overlay-install-mac.sh "$RUNNER_TEMP/hotfix/"*.dmg
      - name: Install Windows update over the original location
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe=(Get-ChildItem "$env:RUNNER_TEMP/hotfix/*.exe").FullName
          ./scripts/overlay-install-win.ps1 $exe
      - name: Reopen with the original profile and read devices, model, chat and attachment
        shell: bash
        env:
          AIMANITY_QA_PHASE: candidate
        run: cargo +1.96.0 test --locked --manifest-path apps/native/Cargo.toml --bin aimanity-native fluorine_overlay -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fluorine-overlay-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/overlay-profile/*.png
            ${{ runner.temp }}/overlay-profile/*.log
          if-no-files-found: ignore
          retention-days: 7
