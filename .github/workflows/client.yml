name: Dysprosium Windows native checks
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full source commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      DYSPROSIUM_SOURCE: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Pin Rust and check the source commit
        run: |
          test "$(git rev-parse HEAD)" = "$DYSPROSIUM_SOURCE"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Check Windows native workbench
        working-directory: apps/native
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Check Windows native host runtime
        run: |
          cargo fmt -p ai-phone-host-runtime --check
          cargo clippy -p ai-phone-host-runtime --all-targets --locked -- -D warnings
          cargo test -p ai-phone-host-runtime --lib --locked
