name: Native client checks
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      platform:
        description: Native checks to run
        type: choice
        options: [all, windows]
        default: all
permissions:
  contents: read
concurrency:
  group: client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-workbench:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2022"]' || '["macos-26","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint native workbench
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build native workbench
        run: cargo build --locked
      - name: Test native workbench
        run: cargo test --locked
      - name: Open and reopen a fresh zero-device Windows workbench
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $env:AIMANITY_QA_OCR = "$env:ProgramFiles\Tesseract-OCR\tesseract.exe"
          $env:AIMANITY_QA_CLIENT = (Resolve-Path target/debug/aimanity-native.exe).Path
          cargo test --locked --bin aimanity-native windows_empty_workbench -- --ignored --nocapture
      - name: Exercise local and paired Windows desktops in Notepad
        if: runner.os == 'Windows'
        run: cargo test --locked windows_notepad_receives_host_input -- --ignored --nocapture
      - name: Test native host runtime
        working-directory: .
        run: cargo test -p ai-phone-host-runtime --lib --locked
  macos-arm64:
    if: inputs.platform != 'windows'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain and locked dependencies
        run: |
          test "$(uname -m)" = arm64
          cmake --version
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0
      - name: Native OCR qualification tools
        run: |
          brew install --force-bottle tesseract
          cargo run --quiet --locked -p ai-phone-release-tools -- prepare-ocr-models --destination "$RUNNER_TEMP/aiphone-ocr-models"
          echo "AI_PHONE_TEST_TESSERACT=$(command -v tesseract)" >> "$GITHUB_ENV"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/aiphone-ocr-models" >> "$GITHUB_ENV"
      - name: Qualify native services and dependency advisories
        run: |
          set -euo pipefail
          (
            audit_dir="$RUNNER_TEMP/aiphone-cargo-audit"
            archive=cargo-audit-aarch64-apple-darwin-v0.22.2.tgz
            mkdir "$audit_dir"
            curl -fsSL "https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/$archive" -o "$audit_dir/$archive"
            printf '%s  %s\n' ec7ca4263769593df4d909be85b94a6b79efa2897be5d2bb8ebd516e823175af "$audit_dir/$archive" | shasum -a 256 -c -
            tar -xzf "$audit_dir/$archive" -C "$audit_dir" --strip-components 1 "${archive%.tgz}/cargo-audit"
            PATH="$audit_dir:$PATH" cargo run --quiet --locked -p ai-phone-release-tools -- audit-dependencies --target aarch64-apple-darwin --output audit.json
          ) > "$RUNNER_TEMP/aiphone-native-audit.log" 2>&1 &
          audit_pid=$!
          native_result=0
          cargo run --quiet --locked -p ai-phone-release-tools -- native-services build || native_result=$?
          audit_result=0
          wait "$audit_pid" || audit_result=$?
          cat "$RUNNER_TEMP/aiphone-native-audit.log"
          test "$native_result" -eq 0 && test "$audit_result" -eq 0 || exit 1
      - name: Retain sanitized dependency diagnostics
        if: always() && hashFiles('audit.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dependency-audit
          path: audit.json
          if-no-files-found: error
          retention-days: 14

  android-arm64:
    if: inputs.platform != 'windows'
    # Phone-control helpers run inside the virtual Android guest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Android guest application toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build and verify virtual-phone control applications
        run: cargo run --quiet --locked -p ai-phone-release-tools -- phone-apps build .
