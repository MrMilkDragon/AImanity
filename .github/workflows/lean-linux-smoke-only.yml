name: Beryllium sealed Linux desktop verification
on:
  push:
    branches: [codex/beryllium-lean-factory]
    paths: [.github/workflows/lean-linux-smoke-only.yml]
permissions:
  contents: read
  actions: read
env:
  BERYLLIUM_SOURCE: '89dd85e52619df0aa21d7813f22090105cd1b5f3'
  SEALED_INPUTS_RUN: '43700537360'
jobs:

  lean-images:
    name: Linux desktop smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm}
          - {arch: amd64, runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: aimanity-lean-images
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ env.SEALED_INPUTS_RUN }}
          github-token: ${{ github.token }}
          name: lean-linux-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/lean-images
      - name: Boot the exported desktop offline and exercise the GUI
        env:
          IMAGE_ARCH: ${{ matrix.arch }}
        run: bash scripts/smoke-lean-linux.sh "$RUNNER_TEMP/lean-images" "$IMAGE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lean-linux-desktop-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/lean-images/desktop*.png
            ${{ runner.temp }}/lean-images/desktop-attestation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
