---
name: Measure the installed desktop on WHPX
'on':
  push:
    branches:
    - codex/dysprosium-guest-diagnosis
    paths:
    - ".github/workflows/dysprosium-guest-diagnosis.yml"
permissions:
  contents: read
  actions: read
jobs:
  init:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: '14619677066'
        path: "${{ runner.temp }}/guest"
        github-token: "${{ github.token }}"
        run-id: '44713087613'
    - name: Prepare frame measurement in the released guest
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/guest"
        tar -xf windows-guest.payload release-init.cpio.gz
        mkdir unpack
        (cd unpack && gzip -dc ../release-init.cpio.gz | cpio -idmu --quiet)
        cat > unpack/qa-init <<'INNER'
        #!/bin/sh
        exec </dev/console >/dev/console 2>&1
        set -ux
        export PATH=/opt/aiphone/linux/bin:/usr/local/bin:/usr/bin:/bin
        bb=/opt/aiphone/engine/bin/busybox
        finish() { echo "QA_DESKTOP_EXIT $1"; sync; "$bb" poweroff -f; }
        "$bb" mount -t proc proc /proc
        "$bb" mount -t sysfs sysfs /sys
        "$bb" mount -t tmpfs tmpfs /run
        "$bb" mount -t cgroup2 cgroup2 /sys/fs/cgroup
        /sbin/modprobe tun || true
        "$bb" ip link set lo up || true
        for executable in zstd tar unshare mount nsenter bwrap slirp4netns; do command -v "$executable"; done
        "$bb" cat /sys/fs/cgroup/cgroup.controllers
        ls -l /dev/net/tun /sbin/init /bin/mount /usr/bin/unshare /usr/bin/nsenter
        release=$(cat /opt/aiphone/bundle/source.sha256)
        home=/var/lib/aiphone-qa
        mkdir -p "$home"
        chmod 700 "$home"
        /usr/local/libexec/aiphone-bootstrap --stage-source /opt/aiphone/bundle/source.payload "$home" "$release" || finish 2
        root="$home/releases/$release"
        mkdir -p "$root/data/desktop/home"
        cd "$root" || finish 1
        bridge="$root/runtime/services/bin/desktop-bridge"
        ls -l "$bridge"
        started=$(date +%s); echo "Cold desktop start $started"
        "$bridge" native-linux "$root" desktop 2 2560 '' > /qa-desktop.log 2>&1 &
        pid=$!
        for it in $(seq 1 165); do
         if ! kill -0 "$pid" 2>/dev/null; then cat /qa-desktop.log; finish 4; fi
         if "$bridge" native-linux "$root" exec observe </qa-request.json >/qa-response.pb 2>/qa-error.log && [ -s /qa-response.pb ]; then echo "First real desktop frame after $(($(date +%s)-started)) seconds"; cat /qa-desktop.log; wc -c /qa-response.pb; finish 0; fi
         if [ "$it" -eq 30 ]; then echo "First 30 seconds elapsed"; cat /qa-error.log /qa-desktop.log; fi
         sleep 1
        done
        cat /qa-desktop.log /qa-error.log
        finish 5
        INNER
        chmod +x unpack/qa-init
        sed -i '/^exec .*switch_root/i /bin/busybox cp /qa-init /newroot/qa-init\n/bin/busybox chmod 755 /newroot/qa-init\necho "{}" > /newroot/qa-request.json' unpack/init
        sed -i 's@switch_root /newroot /sbin/init@switch_root /newroot /qa-init@' unpack/init
        (cd unpack && find . -print0 | cpio --null --quiet -o -H newc --owner=0:0 | gzip -1 > ../qa.cpio.gz)
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: guest-diagnostic-init
        path: "${{ runner.temp }}/guest/qa.cpio.gz"
        retention-days: 1
  windows:
    needs: init
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: '14619677066'
        path: "${{ runner.temp }}/guest"
        github-token: "${{ github.token }}"
        run-id: '44713087613'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: '14618032626'
        path: "${{ runner.temp }}/qemu"
        github-token: "${{ github.token }}"
        run-id: '44713087613'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: guest-diagnostic-init
        path: "${{ runner.temp }}/init"
    - name: Time the first desktop frame on Windows WHPX
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $PSNativeCommandUseErrorActionPreference=$true
        Set-Location "$env:RUNNER_TEMP/guest"
        tar -xf windows-guest.payload
        $binaries=Join-Path $env:RUNNER_TEMP 'qemu/runtime'
        & "$binaries/qemu-img.exe" create -q -f qcow2 -F qcow2 -b "$PWD/guest.qcow2" scratch.qcow2
        & "$binaries/qemu-system-x86_64.exe" -L "$binaries/share" -machine 'q35,accel=whpx' -cpu Nehalem -nodefaults -display none -no-reboot -smp 2 -m 4096 -rtc base=utc -kernel bzImage -initrd "$env:RUNNER_TEMP/init/qa.cpio.gz" -append 'console=ttyS0 rdinit=/init panic=1' -serial file:qa-console.log -drive 'file=scratch.qcow2,format=qcow2,if=none,id=base' -device virtio-blk-pci,drive=base -drive 'file=release.ext4,format=raw,readonly=on,if=none,id=layer' -device virtio-blk-pci,drive=layer
        Get-Content qa-console.log -Tail 125
        if (!(Select-String -Quiet -SimpleMatch 'QA_DESKTOP_EXIT 0' qa-console.log)){throw 'The released desktop could not produce a WHPX frame'}
