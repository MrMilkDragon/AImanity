name: Linux offline guest inputs
on:
  workflow_dispatch:
    inputs:
      factory_run:
        description: Fluorine Windows factory run containing the new guest
        required: true
        type: string
  workflow_call:
    inputs:
      factory_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  guests:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.factory_run }}
          name: complete-windows-installer
          path: ${{ runner.temp }}/factory
      - name: Extract the Fluorine guest, Android runtime and speech model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.96.0 --profile minimal
          $version = (Get-Content -Raw config/release-policy.json | ConvertFrom-Json).version
          $installer = Join-Path $env:RUNNER_TEMP "factory/AImanity-$version-windows-x64-setup.exe"
          $dest = Join-Path $env:RUNNER_TEMP 'guest-inputs'
          $commit = (Get-Content -Raw "$installer.manifest.json" | ConvertFrom-Json).source_commit
          if ($commit -ne $env:GITHUB_SHA) { throw 'The Windows guest inputs belong to a different commit.' }
          $items = @('{app}\host\source.payload','{app}\host\android.payload','{app}\host\qemu\guest\*','{app}\host\qemu\manifest.json','{app}\host\speech\*')
          cargo +1.96.0 run --locked -p ai-phone-release-tools -- windows-factory unpack . $installer $dest @items
          Set-Content -NoNewline -Encoding ascii (Join-Path "$dest/host" 'source-commit') $commit
          foreach ($p in @('source.payload','android.payload','qemu/guest/bzImage','qemu/guest/guest.qcow2','qemu/guest/release.ext4','qemu/guest/release-init.cpio.gz','qemu/manifest.json','speech/ggml-tiny-q5_1.bin')) {
            if (!(Test-Path -PathType Leaf (Join-Path "$dest/host" $p))) { throw "Missing $p" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-offline-guest-inputs
          path: ${{ runner.temp }}/guest-inputs/host/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
