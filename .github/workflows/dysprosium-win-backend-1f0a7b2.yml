name: Dysprosium Windows source-matched guest QA
on:
  push:
    branches: [codex/dysprosium-win-backend-1f0a7b2]
    paths:
      - .github/workflows/dysprosium-win-backend-1f0a7b2.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: dysprosium-win-backend-1f0a7b2
  cancel-in-progress: true
env:
  PRODUCT_SOURCE: d1966b21cc87116202da2fc9d61c5b8f0c7a8605
  QA_LINUX_ARTIFACT: fixed-native-qa-linux-release-layer
  CALCIUM_BASE_SHA: 1184c13114500f919b6bcc738d9af7e1f872ff192aef624e67aa87a6f9b7446f
  CALCIUM_ANDROID_SHA: 23a97514fdbdbcfaa511549b6e016923023de28ce2de0ad71a2815192b9568ce
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  linux-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      AI_PHONE_TEST_TESSERACT: /usr/bin/tesseract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.PRODUCT_SOURCE }}
          path: exact
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 43923363901
          github-token: ${{ github.token }}
          name: native-qa-immutable-base
          path: ${{ runner.temp }}/immutable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 43989532535
          github-token: ${{ github.token }}
          name: final-sha-native-qa-linux-release-layer
          path: ${{ runner.temp }}/prior-guest
      - name: Prepare the exact Linux workload and native archive tool
        working-directory: exact
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup "${ANDROID_HOME:?}/ndk"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs cpio tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          ./scripts/bootstrap.sh
          ./scripts/bun scripts/source.ts check --repository --manifest
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          cargo build --locked -p ai-phone-release-tools --bin release-tools
          ./scripts/bun scripts/prepare-ocr-models.ts --destination "$RUNNER_TEMP/ocr-models"
          echo "AI_PHONE_TEST_TESSDATA=$RUNNER_TEMP/ocr-models" >> "$GITHUB_ENV"
          echo "QA_BASE=$RUNNER_TEMP/immutable" >> "$GITHUB_ENV"
          echo "QA_LAYER=$RUNNER_TEMP/linux-layer" >> "$GITHUB_ENV"
          echo "QA_PREVIOUS_LAYER=$RUNNER_TEMP/prior-guest" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: v29.9.2
          context: aimanity-native-device-qa
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Compile and seal the source-matched Rust guest services
        working-directory: exact
        timeout-minutes: 20
        run: ./scripts/bun ../qa/windows-native-dev/build-linux-layer.ts services
      - name: Assemble the isolated Linux layer and no-Python OCI images
        working-directory: exact
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export QA_RELEASE_TOOLS="$PWD/target/debug/release-tools"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/qa-development-codec"
          mkdir -p "$CARGO_TARGET_DIR/debug"
          cat > "$CARGO_TARGET_DIR/debug/release-tools" <<'CODEC'
          #!/bin/sh
          if [ "$1" = encode-xz ] && [ "$3" = 9 ]; then
            exec "$QA_RELEASE_TOOLS" "$1" "$2" 3 "$4"
          fi
          exec "$QA_RELEASE_TOOLS" "$@"
          CODEC
          chmod +x "$CARGO_TARGET_DIR/debug/release-tools"
          ./scripts/bun ../qa/windows-native-dev/build-linux-layer.ts layer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.QA_LINUX_ARTIFACT }}
          path: ${{ runner.temp }}/linux-layer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
