name: Prepare Android ARM64 guest for AVF
on:
  workflow_dispatch:
  push:
    branches: [build/android-guest-avf]
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare ARM64 Android and the bundled guest applications
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lz4 android-sdk-libsparse-utils
          rustup toolchain install 1.96.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.96.0
          rustup target add aarch64-linux-android x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          inputs="$RUNNER_TEMP/guest-inputs"
          mkdir -p "$inputs/android"
          cargo build --quiet --locked -p ai-phone-release-tools --bin release-tools
          target/debug/release-tools fetch-aosp arm64 "$RUNNER_TEMP/aosp.zip"
          unzip -q "$RUNNER_TEMP/aosp.zip" boot.img init_boot.img vendor_boot.img vbmeta.img vbmeta_system.img \
            vbmeta_system_dlkm.img vbmeta_vendor_dlkm.img super.img userdata.img -d "$inputs/android"
          rm "$RUNNER_TEMP/aosp.zip"
          target/debug/release-tools prepare-speech-model "$RUNNER_TEMP/speech-cache" "$inputs"
          bash scripts/mobile-android-images.sh "$inputs" "$RUNNER_TEMP/avf-inputs"
          cd "$RUNNER_TEMP/avf-inputs"
          find android speech -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/android-prepared.sha256"
          sha256sum --check "$RUNNER_TEMP/android-prepared.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-avf-assets
          path: ${{ runner.temp }}/avf-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-guest-preparation-receipt
          path: ${{ runner.temp }}/android-prepared.sha256
          if-no-files-found: error
          retention-days: 30
