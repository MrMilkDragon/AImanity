name: Prepare Android ARM64 guest for AVF
on:
  workflow_dispatch:
  push:
    branches: [build/europium-android-avf]
permissions:
  contents: read
  actions: read
jobs:
  partitions:
    uses: ./.github/workflows/android-mobile-inputs.yml
  android:
    needs: partitions
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: europium-mobile-android-arm64-inputs
          path: ${{ runner.temp }}/europium-input
      - name: Unpack the offline Android partitions
        working-directory: ${{ runner.temp }}/europium-input
        run: tar --sparse -xJf android-arm64-inputs.tar.xz
      - name: Prepare and validate ARM64 boot and partition assets
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lz4 android-sdk-libsparse-utils
          rustup toolchain install 1.96.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.96.0
          rustup target add aarch64-linux-android x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          bash scripts/mobile-android-images.sh "$RUNNER_TEMP/europium-input" "$RUNNER_TEMP/avf-inputs"
          cd "$RUNNER_TEMP/avf-inputs"
          find android speech -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/android-prepared.sha256"
          sha256sum --check "$RUNNER_TEMP/android-prepared.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: europium-mobile-android-avf-assets
          path: ${{ runner.temp }}/avf-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-guest-preparation-receipt
          path: ${{ runner.temp }}/android-prepared.sha256
          if-no-files-found: error
          retention-days: 30
