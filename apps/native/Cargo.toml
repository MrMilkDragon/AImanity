[package]
name = "aimanity-native"
version = "0.0.4"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tokio", "image-without-codecs", "advanced", "advanced-shaping", "svg", "markdown", "canvas", "x11", "wayland"] }
ai-phone-api = { path = "../../crates/api" }
ai-phone-host-runtime = { path = "../../crates/host-runtime" }
ai-phone-local-speech = { path = "../../crates/local-speech" }
arboard = "3"
cpal = "=0.16.0"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
prost = "=0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
open = "5"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
fs2 = "0.4"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
ring = "=0.17.14"
semver = "1"
tempfile = "3"
tokio-tungstenite = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
bytemuck = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.lzma-sys]
opt-level = 3

[profile.release]
lto = "thin"
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSThread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Media_Speech", "Win32_System_Com", "Win32_System_Variant"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
