[package]
name = "aimanity-native"
version = "0.0.4"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tokio", "image-without-codecs", "advanced", "advanced-shaping", "x11", "wayland"] }
ai-phone-api = { path = "../../crates/api" }
ai-phone-host-runtime = { path = "../../crates/host-runtime" }
prost = "=0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
bytemuck = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = "debuginfo"
