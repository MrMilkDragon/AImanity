[package]
name = "aimanity-android-host"
version = "0.0.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
serde_json = "1"
tempfile = "3"
libc = "=0.2.191"

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }

[profile.release]
strip = true
