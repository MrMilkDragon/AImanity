[workspace]
members = ["crates/api", "crates/vision", "crates/phone-runner", "crates/assistant", "crates/guest-runtime", "crates/host-runtime", "crates/adb-client", "crates/release-tools", "crates/local-speech"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.dev.package.lzma-sys]
opt-level = 3


[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.ai-phone-release-tools]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
